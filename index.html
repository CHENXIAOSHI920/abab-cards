<style>
  :root{

  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    min-height:100dvh;
    display:flex; flex-direction:column; gap:10px;
    max-width:680px; margin:0 auto;
    padding:16px 16px calc(14px + env(safe-area-inset-bottom));
    background:var(--paper); color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .top{display:grid;grid-template-columns:1fr auto;align-items:end;gap:2px 12px}
  .brand h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.03em}
  .brand p{margin:3px 0 0;font-size:11.5px;color:var(--ink3)}
  .counter{text-align:right;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .counter b{font-size:17px;font-weight:600;color:var(--ink)}
  .progress{grid-column:1/-1;height:3px;margin-top:9px;border-radius:3px;background:#EDE6DA;overflow:hidden}
  .progress i{display:block;height:100%;width:0;border-radius:3px;background:var(--accent);transition:width .25s ease,background .25s ease}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;font:inherit;font-size:12.5px;padding:6px 12px;border-radius:999px;
        border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .toggles{display:flex;flex-wrap:wrap;gap:6px}
  .tg{font:inherit;font-size:12px;padding:5px 10px;border-radius:8px;border:1px dashed #DCD2C4;
      background:transparent;color:var(--ink3);cursor:pointer}
  .tg.on{border-style:solid;border-color:var(--ink);background:var(--ink);color:#fff}
  main{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
  .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 0}
  .card{position:relative;width:100%;max-width:480px;height:100%;max-height:620px;min-height:250px;
        margin:auto;transform-style:preserve-3d;cursor:pointer;
        user-select:none;-webkit-user-select:none;
        transition:transform .5s cubic-bezier(.22,.72,.24,1)}
  .card.flipped{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;display:flex;flex-direction:column;padding:18px;
        border-radius:22px;overflow:hidden;
        backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .blank{background:#FFFEFB;border:1px solid var(--line);box-shadow:0 14px 34px -22px rgba(70,52,34,.45);
         align-items:center;justify-content:center;text-align:center}
  .info{transform:rotateY(180deg);border:1px solid var(--line);
        background:linear-gradient(180deg,var(--tint) 0%,#fff 58%);
        box-shadow:0 14px 34px -22px rgba(70,52,34,.45)}
  .info::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--accent)}
  .cat{align-self:flex-start;font-size:11.5px;padding:3px 10px;border-radius:999px;
       background:#fff;border:1px solid var(--accent);color:var(--accent)}
  .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:12px;padding:6px 2px;text-align:center;overflow-y:auto;scrollbar-width:none}
  .mid::-webkit-scrollbar{display:none}
  .word{font-size:clamp(30px,9.5vw,46px);font-weight:600;letter-spacing:.04em;line-height:1.18;word-break:break-word}
  .word.med{font-size:clamp(24px,7.5vw,38px)}
  .word.long{font-size:clamp(19px,5.6vw,30px);letter-spacing:.02em}
  .blank .word{font-size:clamp(38px,12vw,60px)}
  .blank .word.med{font-size:clamp(30px,9.5vw,48px)}
  .blank .word.long{font-size:clamp(22px,7vw,34px)}
  .cn{font-size:clamp(16px,4.6vw,20px);line-height:1.65;color:var(--ink);max-width:20em;transition:filter .22s ease}
  .cn.blur{filter:blur(9px);cursor:pointer}
  .exbox{display:none;width:100%}
  .exbox.on{display:block}
  .ex{margin:12px auto 0;max-width:23em;padding-top:12px;border-top:1px dashed var(--line);
      font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
      font-size:clamp(12.5px,3.7vw,14.5px);line-height:2;color:var(--ink2);text-align:left}
  .ex .hit{font-style:normal;font-weight:700;color:var(--accent);
           border-bottom:2px solid var(--accent);padding-bottom:1px}
  .src{margin:9px 0 0;font-size:10.5px;color:var(--ink3);text-align:right;letter-spacing:.02em}
  .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
  .mini{font:inherit;font-size:12.5px;padding:6px 12px;border-radius:999px;
        border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer}
  .mini.on{border-color:#E0B84C;background:#FFF8E4;color:#B98B12}
  .note{font-size:11px;color:#BDB2A6}
  .note.warn{color:var(--accent);border:1px dashed var(--accent);border-radius:999px;padding:3px 9px}
  .nav{display:flex;gap:8px}
  .nav button{flex:1;font:inherit;font-size:14px;padding:13px 8px;border-radius:14px;
              border:1px solid var(--line);background:#fff;color:#4A423B;cursor:pointer}
  .nav button:active{transform:translateY(1px)}
  .nav #flipBtn{flex:1.4;background:var(--ink);border-color:var(--ink);color:#fff}
  .foot{font-size:11.5px;line-height:1.7;color:var(--ink3);text-align:center;margin:0}
  @media (max-height:640px){
    body{gap:8px;padding-top:10px}
    .card{min-height:200px}
    .ex{line-height:1.8;margin-top:8px;padding-top:8px}
    .word{font-size:clamp(24px,7.5vw,38px)}
    .blank .word{font-size:clamp(28px,9vw,44px)}
    .blank .word.med{font-size:clamp(24px,7.5vw,36px)}
    .blank .word.long{font-size:clamp(18px,6vw,28px)}
    .chips,.toggles{display:none}
  }
</style>

<body>
  <div class="top">
    <div class="brand">
      <h1 id="title">ABAB 副词</h1>
      <p id="subtitle"></p>
    </div>
    <div class="counter"><b id="pos">0</b> / <span id="total">0</span></div>
    <div class="progress"><i id="bar"></i></div>
  </div>

  <div class="chips" id="chips"></div>

  <div class="toggles" id="toggles">
    <button class="tg" data-opt="shuffle">乱序</button>
    <button class="tg" data-opt="hideCn">遮中文</button>
    <button class="tg" data-opt="starOnly">只看★</button>
    <button class="tg on" data-opt="blankFirst">先看假名面</button>
    <button class="tg" data-opt="autoSpeak">自动朗读</button>
  </div>

  <main>
    <div class="stage" id="stage">
      <div class="card" id="card">
        <div class="face blank">
          <div class="word" id="promptWord"></div>
        </div>
        <div class="face info">
          <div class="cat" id="catTag"></div>
          <div class="mid">
            <div class="word" id="word"></div>
            <div class="cn" id="cn"></div>
            <div class="exbox" id="exbox">
              <p class="ex" id="ex"></p>
              <p class="src" id="src"></p>
            </div>
          </div>
          <div class="acts">
            <button class="mini" id="speakBtn">🔊 朗读</button>
            <button class="mini" id="starBtn">★ 标记</button>
            <div class="note" id="noteTag"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="nav">
      <button id="prevBtn">‹ 上一张</button>
      <button id="flipBtn">翻面</button>
      <button id="nextBtn">下一张 ›</button>
    </div>
    <p class="foot" id="foot"></p>
  </main>

const $ = (s) => document.querySelector(s);
const STAR_KEY = 'abab-cards-star-v1';

let starred = new Set();
try { starred = new Set(JSON.parse(localStorage.getItem(STAR_KEY) || '[]')); } catch (e) {}
const saveStars = () => { try { localStorage.setItem(STAR_KEY, JSON.stringify([...starred])); } catch (e) {} };

const opts = { cat:'all', shuffle:false, hideCn:false, starOnly:false, blankFirst:true, autoSpeak:false };

const catById = {};
for (const c of DATA.categories) catById[c.id] = c;

let deck = [];
let idx = 0;
let showInfo = false;
let cnRevealed = false;

const keyOf = (w) => w.cat + '|' + w.w;

const escapeHtml = (s) => String(s).replace(/[&<>"]/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
));

function shuffleInPlace(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
}

function reload(keepKey) {
  const keep = keepKey || (deck[idx] ? keyOf(deck[idx]) : null);
  let list = DATA.words.filter((w) => opts.cat === 'all' || w.cat === opts.cat);
  if (opts.starOnly) list = list.filter((w) => starred.has(keyOf(w)));
  if (opts.shuffle) shuffleInPlace(list);
  deck = list;
  idx = keep ? deck.findIndex((w) => keyOf(w) === keep) : 0;
  if (idx < 0) idx = 0;
  showInfo = !opts.blankFirst;
  cnRevealed = false;
  render();
  if (showInfo && opts.autoSpeak && deck[idx]) speak(deck[idx].w);
}

function clamp() {
  if (!deck.length) { idx = 0; return; }
  if (idx < 0) idx = deck.length - 1;
  if (idx >= deck.length) idx = 0;
}

function footText() {
  return (showInfo ? '轻点卡片翻回假名面' : '轻点卡片翻面看释义') + ' · 已标星 ' + starred.size + ' 个';
}

function render() {
  const w = deck[idx];
  const card = $('#card');
  const total = deck.length;

  $('#total').textContent = total;
  $('#pos').textContent = total ? idx + 1 : 0;
  $('#bar').style.width = total ? ((idx + 1) / total) * 100 + '%' : '0%';

  if (!w) {
    card.style.visibility = 'hidden';
    $('#foot').textContent = opts.starOnly
      ? '还没有标星的词。翻到信息面点「★ 标记」，就能把记不住的词单独存起来。'
      : '这个词组里没有卡片。';
    return;
  }
  card.style.visibility = 'visible';

  const c = catById[w.cat] || { name:'', accent:'#C2707C', tint:'#FCF3F2' };
  card.style.setProperty('--accent', c.accent);
  card.style.setProperty('--tint', c.tint);
  document.documentElement.style.setProperty('--accent', c.accent);
  $('#bar').style.background = c.accent;
  $('#catTag').textContent = c.name;

  const sizeClass = w.w.length >= 7 ? ' long' : w.w.length >= 5 ? ' med' : '';
  const word = $('#word');
  word.textContent = w.w;
  word.className = 'word' + sizeClass;
  const promptWord = $('#promptWord');
  promptWord.textContent = w.w;
  promptWord.className = 'word' + sizeClass;

  $('#cn').textContent = w.cn;
  $('#cn').classList.toggle('blur', opts.hideCn && !cnRevealed);

  const exbox = $('#exbox');
  if (w.ex) {
    const hit = escapeHtml(w.w);
    $('#ex').innerHTML = escapeHtml(w.ex).split(hit).join('<em class="hit">' + hit + '</em>');
    $('#src').textContent = '出处：' + (w.src || '');
    exbox.classList.add('on');
  } else {
    $('#ex').textContent = '';
    $('#src').textContent = '';
    exbox.classList.remove('on');
  }

  const note = $('#noteTag');
  if (w.note) { note.textContent = w.note; note.className = 'note warn'; }
  else { note.textContent = '严格 ABAB'; note.className = 'note'; }

  const on = starred.has(keyOf(w));
  const star = $('#starBtn');
  star.classList.toggle('on', on);
  star.textContent = on ? '★ 已标记' : '★ 标记';

  card.classList.toggle('flipped', showInfo);
  $('#foot').textContent = footText();
}

function flip(force) {
  if (!deck[idx]) return;
  showInfo = typeof force === 'boolean' ? force : !showInfo;
  cnRevealed = false;
  $('#cn').classList.toggle('blur', opts.hideCn);
  $('#card').classList.toggle('flipped', showInfo);
  $('#foot').textContent = footText();
  if (showInfo && opts.autoSpeak) speak(deck[idx].w);
}

function go(step) {
  if (!deck.length) return;
  idx += step;
  clamp();
  showInfo = !opts.blankFirst;
  cnRevealed = false;
  render();
  if (showInfo && opts.autoSpeak) speak(deck[idx].w);
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 0.85;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch (e) {}
}

function buildChips() {
  const chips = $('#chips');
  const make = (id, label) => {
    const b = document.createElement('button');
    b.className = 'chip' + (opts.cat === id ? ' on' : '');
    b.textContent = label;
    b.addEventListener('click', () => {
      opts.cat = id;
      buildChips();
      reload(null);
    });
    return b;
  };
  chips.innerHTML = '';
  chips.appendChild(make('all', '全部 ' + DATA.words.length));
  for (const c of DATA.categories) {
    const n = DATA.words.filter((w) => w.cat === c.id).length;
    chips.appendChild(make(c.id, c.name + ' ' + n));
  }
}

document.querySelectorAll('.tg').forEach((b) => {
  b.addEventListener('click', () => {
    const k = b.dataset.opt;
    opts[k] = !opts[k];
    b.classList.toggle('on', opts[k]);
    if (k === 'blankFirst') {
      showInfo = !opts.blankFirst;
      cnRevealed = false;
      render();
    } else {
      reload(null);
    }
    b.blur();
  });
});

let touchX = null, touchY = null, swiped = false;

$('#card').addEventListener('click', () => {
  if (swiped) { swiped = false; return; }
  flip();
});

$('#cn').addEventListener('click', (e) => {
  e.stopPropagation();
  if (opts.hideCn && !cnRevealed) {
    cnRevealed = true;
    $('#cn').classList.remove('blur');
    return;
  }
  flip();
});

$('#starBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  const w = deck[idx];
  if (!w) return;
  const k = keyOf(w);
  if (starred.has(k)) starred.delete(k); else starred.add(k);
  saveStars();
  if (opts.starOnly && !starred.has(k)) reload(null); else render();
});

$('#speakBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  if (deck[idx]) speak(deck[idx].w);
});

$('#prevBtn').addEventListener('click', (e) => { go(-1); e.currentTarget.blur(); });
$('#nextBtn').addEventListener('click', (e) => { go(1); e.currentTarget.blur(); });
$('#flipBtn').addEventListener('click', (e) => { flip(); e.currentTarget.blur(); });

const stage = $('#stage');
stage.addEventListener('touchstart', (e) => {
  touchX = e.touches[0].clientX;
  touchY = e.touches[0].clientY;
  swiped = false;
}, { passive: true });
stage.addEventListener('touchmove', (e) => {
  if (touchX === null) return;
  const dx = e.touches[0].clientX - touchX;
  const dy = e.touches[0].clientY - touchY;
  if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) swiped = true;
}, { passive: true });
stage.addEventListener('touchend', (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) {
    swiped = true;
    go(dx < 0 ? 1 : -1);
  }
  touchX = null;
  touchY = null;
}, { passive: true });

document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
});

$('#title').textContent = DATA.meta.title;
$('#subtitle').textContent = DATA.meta.subtitle;
document.title = DATA.meta.title + ' · 单词卡';
buildChips();
reload(null);
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
